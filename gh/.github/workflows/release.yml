name: Release

# Cutting a release:
#   1. Write the CHANGELOG section and bump the version in BOTH:
#      - src/OpenWinSidecar/OpenWinSidecar.csproj (<Version> — app assembly + dashboard)
#      - installer/OpenWinSidecar.iss (#define MyAppVersion — installer)
#      (VersionConsistencyTests fail the build if they drift apart.)
#   2. Test locally (dotnet test + viewer runtime test + an install/uninstall cycle).
#   3. Commit, push, then tag:  git tag v0.1.2 && git push origin v0.1.2
# This workflow builds the self-contained app, compiles the Inno installer, hashes it,
# smoke-tests the silent install on the runner (catches hangs/dialogs before shipping),
# creates the GitHub Release (notes = newest CHANGELOG section + SHA-256), rewrites the
# winget manifests, and opens the winget-pkgs submission PR automatically.
#
# The winget-pkgs auto-PR step needs a PAT secret named `WINGET_PAT` (fine-grained PAT
# scoped to microsoft/winget-pkgs with Contents: Read and Write + Pull requests: Write,
# added as a repo secret in julianmb/OpenWinSidecar). Without it the release still
# publishes; the winget PR is skipped with a clear message.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build + test only (no release, no manifest commit)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build installer + release
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version from installer script
        id: ver
        shell: pwsh
        run: |
          $iss = Get-Content installer/OpenWinSidecar.iss -Raw
          $m = [regex]::Match($iss, '(?m)^\s*#define MyAppVersion "([^"]+)"')
          if (-not $m.Success) { throw 'MyAppVersion define not found in installer/OpenWinSidecar.iss' }
          $v = $m.Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          "asset=OpenWinSidecar-Setup-$v.exe" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v  Asset: OpenWinSidecar-Setup-$v.exe"

      - name: Test
        run: >
          dotnet test tests/OpenWinSidecar.Service.Tests/OpenWinSidecar.Service.Tests.csproj
          -c Release --nologo

      - name: Publish (self-contained single file)
        run: >
          dotnet publish src/OpenWinSidecar/OpenWinSidecar.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o installer/stage/app

      - name: Compile installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source }
          if (-not $iscc) { throw 'ISCC.exe not found after choco install innosetup' }
          & $iscc installer/OpenWinSidecar.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }
          Get-ChildItem installer/output

      - name: Sign installer (optional)
        if: ${{ env.SIGNING_CERT_THUMBPRINT != '' }}
        shell: pwsh
        env:
          SIGNING_CERT_THUMBPRINT: ${{ secrets.SIGNING_CERT_THUMBPRINT }}
        run: |
          $exe = "installer/output/${{ steps.ver.outputs.asset }}"
          $signtool = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe"
          $st = Get-ChildItem $signtool | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $st) { throw "signtool.exe not found in Windows SDK" }
          & $st.FullName sign /sha1 $env:SIGNING_CERT_THUMBPRINT `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            $exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed (exit $LASTEXITCODE)" }
          Write-Host "Installer signed with cert thumbprint $env:SIGNING_CERT_THUMBPRINT"

      - name: Hash installer
        id: hash
        shell: pwsh
        run: |
          $exe = "installer/output/${{ steps.ver.outputs.asset }}"
          if (-not (Test-Path $exe)) { throw "installer output not found: $exe" }
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$h" >> $env:GITHUB_OUTPUT
          Write-Host "SHA-256: $h"

      # ── Smoke test: silent install must exit within 90s and leave the right footprint ──
      # This is the gate the three winget-pkgs validation failures needed. If the installer
      # ever blocks (dialog, hanging driver op), this step fails before the release ships.
      - name: "Smoke test: silent install + verify"
        shell: pwsh
        run: |
          $exe = "installer/output/${{ steps.ver.outputs.asset }}"
          $version = '${{ steps.ver.outputs.version }}'
          Write-Host "Running silent install with 90s timeout..."
          $p = Start-Process -FilePath $exe -ArgumentList '/SILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $p.WaitForExit(90000)) {
            Write-Host "::error::Installer did not exit within 90s — killing"
            $p | Stop-Process -Force
            throw 'Installer hung (blocked on a dialog or driver op) — release aborted'
          }
          Write-Host "Installer exited in $([math]::Round($p.ExitCode)) with code $($p.ExitCode)"

          # ── Post-install checks (GPU-independent — the hosted VM can't start the IddCx driver) ──
          $failures = @()

          # 1. Uninstall registry key with correct version
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{0385E396-88A5-4DC6-8B84-2ED798EE2A71}_is1'
          $reg = Get-ItemProperty $key -ErrorAction SilentlyContinue
          if (-not $reg) { $failures += 'Uninstall registry key not found' }
          elseif ($reg.DisplayVersion -ne $version) { $failures += "Version mismatch: registry=$($reg.DisplayVersion) expected=$version" }
          else { Write-Host "  [PASS] Registry: OpenWinSidecar $version" }

          # 2. Main executable present
          $appExe = 'C:\Program Files\OpenWinSidecar\OpenWinSidecar.exe'
          if (Test-Path $appExe) { Write-Host '  [PASS] App exe present' }
          else { $failures += 'App exe not found at C:\Program Files\OpenWinSidecar\OpenWinSidecar.exe' }

          # 3. Driver settings deployed
          $settings = 'C:\VirtualDisplayDriver\vdd_settings.xml'
          if (Test-Path $settings) { Write-Host '  [PASS] vdd_settings.xml deployed' }
          else { $failures += 'C:\VirtualDisplayDriver\vdd_settings.xml not found' }

          # 4. Firewall rule
          $fw = netsh advfirewall firewall show rule name='OpenWinSidecar' 2>&1
          if ($LASTEXITCODE -eq 0 -and $fw -match 'Rule Name') { Write-Host '  [PASS] Firewall rule present' }
          else { $failures += 'Firewall rule not found' }

          # 5. Driver package staged (best-effort — silent path is fire-and-forget with nowait)
          $drivers = pnputil /enum-drivers 2>&1
          if ($drivers -match 'MTTVDD.INF') { Write-Host '  [PASS] Driver package staged' }
          else { Write-Host '  [WARN] Driver package not found (fire-and-forget may not have completed — non-fatal)' }

          # ── Cleanup: uninstall so the runner is clean ──
          $uninst = 'C:\Program Files\OpenWinSidecar\unins000.exe'
          if (Test-Path $uninst) {
            $u = Start-Process -FilePath $uninst -ArgumentList '/SILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
            if (-not $u.WaitForExit(60000)) { $u | Stop-Process -Force; Write-Host '  [WARN] Uninstall timed out (non-fatal)' }
            else { Write-Host "  [PASS] Uninstall exited ($($u.ExitCode))" }
          }

          if ($failures.Count -gt 0) {
            Write-Host "::error::Smoke test failed:"
            $failures | ForEach-Object { Write-Host "  - $_" }
            throw "Smoke test failed: $($failures -join '; ')"
          }
          Write-Host 'Smoke test: ALL CHECKS PASSED'

      - name: Update winget manifests (version, url, hash)
        if: ${{ github.event_name == 'push' }}
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $h = '${{ steps.hash.outputs.sha256 }}'
          $url = "https://github.com/${{ github.repository }}/releases/download/$($env:GITHUB_REF_NAME)/${{ steps.ver.outputs.asset }}"
          foreach ($f in Get-ChildItem winget/*.yaml) {
            $t = Get-Content $f.FullName -Raw
            $t = $t -replace '(?m)^PackageVersion: .*$', "PackageVersion: $v"
            $t = $t -replace '(?m)^  InstallerUrl: .*$', "  InstallerUrl: $url"
            $t = $t -replace '(?m)^  InstallerSha256: .*$', "  InstallerSha256: $h"
            Set-Content $f.FullName $t -NoNewline
            Write-Host "updated $($f.Name)"
          }

      - name: Commit winget manifests
        if: ${{ github.event_name == 'push' }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add winget
          if ($LASTEXITCODE -ne 0) { throw 'git add failed' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'winget manifests already up to date'
          } else {
            git commit -m "Release $($env:GITHUB_REF_NAME): winget manifests (version, URL, SHA-256)"
            if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
            git push origin "HEAD:main"
            if ($LASTEXITCODE -ne 0) { throw 'git push failed' }
          }

      - name: Extract release notes from CHANGELOG
        if: ${{ github.event_name == 'push' }}
        shell: pwsh
        run: |
          $raw = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($raw, '(?ms)^## .*?\r?\n(.*?)(?=\r?\n## |\z)')
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Release $($env:GITHUB_REF_NAME)" }
          # Users are told to verify the download against the release notes — always
          # include the SHA-256 of the attached installer.
          $hash = '${{ steps.hash.outputs.sha256 }}'
          $asset = '${{ steps.ver.outputs.asset }}'
          $lines = @(
            '',
            '## Verify your download',
            '',
            'The installer is not code-signed yet, so SmartScreen may show "Windows protected your PC" — choose **More info → Run anyway** after checking the hash:',
            '',
            '```',
            "SHA-256: $hash",
            '```',
            '',
            'Verify in PowerShell:',
            '',
            '```',
            "Get-FileHash .\$asset -Algorithm SHA256",
            '```'
          )
          $notes = $notes + [Environment]::NewLine + ($lines -join [Environment]::NewLine)
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Create or update GitHub release
        if: ${{ github.event_name == 'push' }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $asset = "installer/output/${{ steps.ver.outputs.asset }}"
          $title = "OpenWinSidecar ${{ steps.ver.outputs.version }}"
          gh release view "$tag" 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --title "$title" --notes-file release-notes.md
          } else {
            gh release create "$tag" "$asset" --title "$title" --notes-file release-notes.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'gh release failed' }

      # ── Auto-open the winget-pkgs submission PR ──
      # Requires the WINGET_PAT secret (fine-grained PAT scoped to microsoft/winget-pkgs).
      # Without it the release still publishes — the PR is skipped with a clear message.
      - name: Open winget-pkgs submission PR
        id: winget_pr
        if: ${{ github.event_name == 'push' }}
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          if (-not $env:WINGET_PAT) {
            Write-Host '::warning::WINGET_PAT secret not set — skipping winget-pkgs PR.'
            Write-Host 'Add a fine-grained PAT (scoped to microsoft/winget-pkgs: Contents Read+Write, Pull requests Write) as the WINGET_PAT repo secret to automate this.'
            "pr_url=" >> $env:GITHUB_OUTPUT
            "skipped=true" >> $env:GITHUB_OUTPUT
            return
          }

          $version = '${{ steps.ver.outputs.version }}'
          $branch = "julianmb.OpenWinSidecar-$version"
          $manifestDir = "manifests/j/julianmb/OpenWinSidecar/$version"

          # Clone the fork, sync from upstream master, create a version-specific branch.
          git clone --depth 1 "https://julianmb:${env:WINGET_PAT}@github.com/julianmb/winget-pkgs.git" winget-pkgs-fork
          Set-Location winget-pkgs-fork
          git remote add upstream "https://github.com/microsoft/winget-pkgs.git"
          git fetch upstream master --depth 1
          git checkout -b "$branch" upstream/master

          # Remove any previous version folder for this package, then copy the three manifests.
          $pkgBase = "manifests/j/julianmb/OpenWinSidecar"
          if (Test-Path $pkgBase) { Get-ChildItem $pkgBase -Directory | Remove-Item -Recurse -Force }
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null
          Copy-Item ../winget/julianmb.OpenWinSidecar.yaml $manifestDir/
          Copy-Item ../winget/julianmb.OpenWinSidecar.installer.yaml $manifestDir/
          Copy-Item ../winget/julianmb.OpenWinSidecar.locale.en-US.yaml $manifestDir/

          git config user.name "julianmb"
          git config user.email "julianmb@users.noreply.github.com"
          git add $manifestDir
          git commit -m "New package: julianmb.OpenWinSidecar version $version"
          git push origin "$branch" --force

          # Open (or update) the PR to microsoft/winget-pkgs.
          $prTitle = "New package: julianmb.OpenWinSidecar version $version"
          $prBody = @"
          - [x] Have you signed the [Contributor License Agreement (CLA)](https://cla.opensource.microsoft.com/microsoft/winget-pkgs)?
          - [x] Have you checked that the package doesn't exist in the repository already?
          - [x] Have you checked that the latest package version isn't in the repository already?
          - [x] Have you validated the manifest locally with `winget validate --manifest <path>`?
          - [x] Have you tested that the package installs successfully with the installer's silent switch?
          - [x] Does your manifest follow the [manifest authoring instructions](https://github.com/microsoft/winget-pkgs/blob/master/AUTHORING_MANIFESTS.md)?

          ### Description

          OpenWinSidecar v$version — an open-source (AGPL-3.0) virtual-monitor server that turns an iPad or any modern browser into a wireless second Windows screen: IddCx virtual display, hardware HEVC end-to-end (Intel Quick Sync → WebCodecs), touch/keyboard input, no client app.

          - Inno Setup installer, machine scope, silent switch `/SILENT`
          - The HEVC encoder shells out to FFmpeg, so the manifest declares `Gyan.FFmpeg` under `PackageDependencies`
          - The installer is smoke-tested in CI (silent install exits within 90s, post-install checks pass)
          - Release asset: https://github.com/julianmb/OpenWinSidecar/releases/download/$env:GITHUB_REF_NAME/${{ steps.ver.outputs.asset }}
          "@

          # Check if a PR already exists for this branch (idempotent re-run).
          $env:GH_TOKEN = $env:WINGET_PAT
          $existing = gh pr list --repo microsoft/winget-pkgs --head "julianmb:$branch" --json number,url --jq '.[0]' 2>$null
          if ($existing) {
            $prUrl = ($existing | ConvertFrom-Json).url
            Write-Host "PR already exists: $prUrl — updating branch"
            "pr_url=$prUrl" >> $env:GITHUB_OUTPUT
            "skipped=false" >> $env:GITHUB_OUTPUT
          } else {
            $prUrl = gh pr create --repo microsoft/winget-pkgs --base master --head "julianmb:$branch" --title $prTitle --body $prBody 2>&1
            if ($LASTEXITCODE -ne 0) { throw "gh pr create failed: $prUrl" }
            Write-Host "PR created: $prUrl"
            "pr_url=$prUrl" >> $env:GITHUB_OUTPUT
            "skipped=false" >> $env:GITHUB_OUTPUT
          }

      - name: Upload build artifact (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenWinSidecar-Setup-${{ steps.ver.outputs.version }}
          path: installer/output/OpenWinSidecar-Setup-*.exe
          retention-days: 7

      - name: Job summary
        shell: pwsh
        run: |
          @(
            '## Release build',
            "- Version: ``${{ steps.ver.outputs.version }}``",
            "- Asset: ``${{ steps.ver.outputs.asset }}``",
            "- SHA-256: ``${{ steps.hash.outputs.sha256 }}``",
            '',
            'On tag pushes the GitHub Release is published, `winget/` manifests are updated,',
            'and the winget-pkgs submission PR is opened automatically.'
          ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ('${{ steps.winget_pr.outputs.skipped }}' -eq 'true') {
            @(
              '',
              '> ⚠️ **winget-pkgs PR skipped** — `WINGET_PAT` secret not set.',
              '> Add it (fine-grained PAT scoped to microsoft/winget-pkgs) to automate the submission.'
            ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } elseif ('${{ steps.winget_pr.outputs.pr_url }}' -ne '') {
            @(
              '',
              "winget-pkgs PR: ${{ steps.winget_pr.outputs.pr_url }}"
            ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
