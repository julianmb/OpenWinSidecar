name: Build iOS Companion App

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compile Swift Package App + refresh distributable zip
    # macos-15 is required, not cosmetic. Package.swift declares an `.iOSApplication`
    # product (the Swift Playgrounds app target), which is a Swift 6 / SwiftPM feature.
    # This job pinned Xcode 15.4 (Swift 5.10), which cannot parse that product type, so it
    # failed on `swift build` every single run - eight consecutive failures since it was
    # added on 2026-09-14, all of them the same toolchain mismatch.
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        # Xcode 16 ships the Swift 6 toolchain that understands .iOSApplication.
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show toolchain
        run: swift --version

      # Diagnostic only. An app-only package (a single .iOSApplication product, no
      # library) does not necessarily expose a scheme that `xcodebuild -list` will
      # enumerate, so this step can fail on a perfectly good package. It must never
      # block the build - it is here so the scheme list appears in the log if the
      # build step ever needs it.
      - name: List schemes
        continue-on-error: true
        run: cd ios/OpenWinSidecarClient && xcodebuild -list || true

      - name: Build Swift Package App
        run: |
          cd ios/OpenWinSidecarClient
          # NOT `swift build`. That compiles the package for the HOST, which is macOS -
          # and this package is declared `platforms: [.iOS("16.0)]` and imports UIKit, so
          # it can never build for the host. `xcodebuild` with an iOS destination is the
          # only correct invocation, and an .iOSApplication product additionally needs
          # Xcode's app pipeline.
          #
          # On failure, copy the compiler errors into the run summary. GitHub's log
          # download endpoint requires authentication, so without this the only way to
          # see the actual error is to be able to fetch the raw log.
          set -o pipefail
          xcodebuild -scheme OpenWinSidecar -destination 'generic/platform=iOS' build 2>&1 \
            | tee /tmp/xcodebuild.log \
            || {
                echo "### xcodebuild failed - first errors" >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                grep -E "error:|fatal error|BUILD FAILED|build commands failed" /tmp/xcodebuild.log \
                  | sort -u | head -40 >> "$GITHUB_STEP_SUMMARY" || echo "(no error lines matched)" >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                exit 1
              }

      # The server distributes OpenWinSidecar.swiftpm.zip (see SidecarTcpServer.ServeIosAppZipAsync).
      # Rebuild it from the single canonical source on every green build so it can never go stale.
      - name: Refresh distributable Swift Playgrounds zip
        run: |
          rm -rf /tmp/swiftpm-dist
          mkdir -p /tmp/swiftpm-dist
          cp -R ios/OpenWinSidecarClient /tmp/swiftpm-dist/OpenWinSidecar.swiftpm
          rm -rf /tmp/swiftpm-dist/OpenWinSidecar.swiftpm/.build
          rm -f ios/OpenWinSidecar.swiftpm.zip
          (cd /tmp/swiftpm-dist && zip -qr "$GITHUB_WORKSPACE/ios/OpenWinSidecar.swiftpm.zip" OpenWinSidecar.swiftpm -x '*/.*')

      - name: Commit refreshed zip
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh ios/OpenWinSidecar.swiftpm.zip from source"
          file_pattern: ios/OpenWinSidecar.swiftpm.zip
